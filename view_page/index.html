<head>
<title>VSO DP</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<H2>VSO Data Provider Status page</H2>

<script src="get_results.js"></script>

<P>
Links to the <a href="/docs" target="_blank">API docs</a> and <a href="/redoc" target="_blank">redoc</a>
as well as the <a href="https://github.com/nilesOien/get_dp_health" target="_blank">code repo</a>
</P>

<P>
  Provider :  <input type="text" id="provider_box" placeholder="NSO">  <br>
  Source : <input type="text" id="source_box" placeholder="GONG">  <br>
  Instrument : <input type="text" id="instrument_box" placeholder="Learmonth"> <br>
  Downloads : <input type="text" id="num_downloads_box" placeholder="1"> (0 => Query only, Negative => Default, Else specifies number of downloads) <br>
  Use POST <input type="checkbox" id="use_post" value="no">
  <button onclick="get_results();">Execute</button>
  <button onclick="clear_results();">Clear</button>
  <button onclick="show_options();">Options</button>
</P>

<p id="result_para"></p>

</body>
